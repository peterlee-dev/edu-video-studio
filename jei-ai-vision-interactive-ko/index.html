<body>

<script>

// isometrically, the roadmap scrolls, the POD cycle runs. The closing page first pulls back to show every panel at once.
// Timing: timeline.js, written by tools/make_audio.py from the real narration. Pictures follow spoken words

// the narration's scenes (tools/script.py, shared with ../jei-ai-vision-ko) step through each PDF page; here a page is one panel,
// so consecutive scenes of the same page are merged (the camera flies only when the page changes, where the mix has its whoosh)
const PAGE_OF = { kmapList: 'kmap', kmapDots: 'kmap', kmapAI: 'kmap', countryTrack: 'country', layerAgent: 'layers', layerService: 'layers', layerPace: 'layers',
  phase1: 'roadmap', phase2: 'roadmap', wiki: 'roadmap', podCycle: 'pod', assistant: 'online', statusMap: 'status', statuses: 'status', statusUpdate: 'status',
  change1: 'benefits', change2: 'benefits', change3: 'benefits', change4: 'benefits' };

const S = id => PAGES.find(s => s.id === id) || { start: 0, end: 0 };
const st = (id, f = 0) => L(id).start + (L(id).end - L(id).start) * f;   // f: 0 = start of the narration line, 1 = end
const en = (id, d = 0) => L(id).end + d;
// time a word is spoken in a line (one of several spellings, the nth time it occurs); falls back to a fraction of the line.
// Korean words carry their particles ("효율을", "AI는"), so a cue matches the start of a spoken word
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
const MISS = window.CUE_MISS = new Set();

// ---------- drawing ----------

function T(s, x, y, { size = 28, weight = 500, color = K.ink, align = 'left', alpha = 1, maxW, base = 'middle', spacing = 0, glow = 0 } = {}) {

const wCache = {};

}
function para(s, x, y, maxW, o = {}) { const size = o.size || 28, lh = o.lh || size * 1.45, ls = wrap(s, size, o.weight || 500, maxW); ls.forEach((l, i) => T(l, x, y + i * lh, o)); return ls.length; }
// typing: the first k of the text, with a caret while typing
function typeT(s, x, y, k, o = {}) {

}
function chip(s, x, y, { size = 20, weight = 700, color = K.ink, fill = 'rgba(255,255,255,.08)', stroke = null, a = 1, align = 'left', padX = 16, h, ic, lw = 1.5 } = {}) {
  if (a <= 0) return 0; h = h || size * 1.9;
  const iw = ic ? size * 1.35 : 0, w = measure(s, size, weight) + padX * 2 + iw, x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  rr(x0, y - h / 2, w, h, h / 2, fill, stroke, lw, a);
  if (ic) icon(ic, x0 + padX + size * .5, y, size * 1.05, color, a);
  T(s, x0 + padX + iw, y + 1, { size, weight, color, alpha: a }); return w;
}
function card(x, y, w, h, { fill = K.card, stroke = K.cardLine, r = 20, a = 1, lw = 2, glow = null, g = 0, hover = 0, shadow = true } = {}) {

  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.38)'; ctx.shadowBlur = 26 + 18 * hover; ctx.shadowOffsetY = 10; }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.shadowColor = 'transparent';
  if (glow && g > 0) { ctx.shadowColor = rgba(glow, .6 * g); ctx.shadowBlur = 34 * g; ctx.lineWidth = lw + 1; ctx.strokeStyle = rgba(glow, .95 * g); ctx.stroke(); ctx.shadowColor = 'transparent'; }

}
// a hovered card keeps its content in place (only its outline and shadow change): moving text a few px
// steps it pixel by pixel, which reads as the letters jumping
function lift(h, fn) { fn(); }
function arrowHead(x, y, ang, s, color, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s, -s * .6); ctx.lineTo(-s, s * .6); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore(); }
function bigArrow(x, y, w, h, color, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.moveTo(x, y - h * .22); ctx.lineTo(x + w * .55, y - h * .22); ctx.lineTo(x + w * .55, y - h * .5); ctx.lineTo(x + w, y); ctx.lineTo(x + w * .55, y + h * .5); ctx.lineTo(x + w * .55, y + h * .22); ctx.lineTo(x, y + h * .22); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore(); }
const bez = (a, c, b, k) => { const u = 1 - k; return [u * u * a[0] + 2 * u * k * c[0] + k * k * b[0], u * u * a[1] + 2 * u * k * c[1] + k * k * b[1]]; };

// ============================================================
// the space: one panel per page on a 4 × 3 grid, visited in a snake
// ============================================================
const POS = { title: [0, 0], why: [1, 0], kmap: [2, 0], universe: [3, 0], country: [3, 1], layers: [2, 1], roadmap: [1, 1], pod: [0, 1], online: [0, 2], status: [1, 2], benefits: [2, 2], outro: [3, 2] };
const TW = 2300, TH = 1400;

const WORLD = { w: 3 * TW + W, h: 2 * TH + H };

// camera inside a panel: keys [time it arrives, x, y, zoom, seconds of travel] in the panel's own 1920 × 1080 coordinates

function draw(t) {

const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');

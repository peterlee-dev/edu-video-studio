<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GEO 모니터링 콘솔</title>
<style>
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #0E1424; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #FFFFFF; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="300" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// GEO 모니터링 콘솔 (geo.esls.io), for the executives in under a minute: what it is, what went into it, what it brings.
// Motion-graphics app promo (the user's references: kinetic Korean type on full-bleed brand-colour backgrounds, words popping in as
// they are spoken, a chat box typing, UI cards flying in, a spotlight walking over the screen, circle wipes between scenes),
// told as questions and answers. Brand red backgrounds alternate with white ones; navy only for "the old way".
// Little text: a word or two per beat, big. The narration and the big words say no report results (the user: stress the strengths);
// the console's own screens (01 question groups, 02 report summary, 03 per-question results, 06 metric settings) are shown as captured.
// Timing: timeline.js, written by tools/make_audio.py from the real narration. Pictures follow spoken words
// (Wc(line, word) looks the word up in TL.lines[line].words). draw(t) is a pure function of time.
// ------------------------------------------------------------
const W = 1920, H = 1080, TL = window.TL, DURATION = TL.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, K = C.colors;
const SANS = "'Avenir Next', 'Noto Sans KR', 'Helvetica Neue', sans-serif";
const WHITE = '#FFFFFF';

// ---------- basics ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const nz = (i, s = 1) => { const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v) - .5; };   // fixed jitter (no flicker)
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const L = id => TL.lines[id] || { start: 0, end: 0, words: [] };
const S = id => TL.scenes.find(s => s.id === id) || { start: 0, end: 0 };
const st = (id, f = 0) => L(id).start + (L(id).end - L(id).start) * f;   // f: 0 = start of the narration line, 1 = end
const en = (id, d = 0) => L(id).end + d;

// time a word is spoken in a line (one of several spellings, the nth time it occurs); falls back to a fraction of the line.
// Korean words carry their particles ("효율을", "AI는"), so a cue matches the start of a spoken word
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
const MISS = window.CUE_MISS = new Set();
function Wd(id, words, f = 0, nth = 1) {
  const want = (Array.isArray(words) ? words : [words]).map(norm); let n = 0;
  for (const [w, s] of L(id).words || []) if (want.some(c => norm(w).startsWith(c)) && ++n === nth) return s;
  MISS.add(`${id}:${want.join('|')}`); return st(id, f);
}
const cueCache = {};
const Wc = (id, words, f, nth) => { const k = id + '|' + words + '|' + nth; return k in cueCache ? cueCache[k] : (cueCache[k] = Wd(id, words, f, nth)); };

function rr(x, y, w, h, r, fill, stroke, lw = 2, a = 1) { if (a <= 0 || w <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function circle(x, y, r, fill, stroke, lw = 3, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
// a white card with a soft shadow
function card(x, y, w, h, { fill = WHITE, r = 22, a = 1, shadow = .16 } = {}) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  if (shadow) { ctx.shadowColor = `rgba(20,24,40,${shadow})`; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16; }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
function measure(str, size, weight = 600) { ctx.save(); ctx.font = `${weight} ${size}px ${SANS}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function text(str, x, y, { size = 36, weight = 600, color = K.ink, align = 'left', alpha = 1, maxW, spacing = 0 } = {}) {
  if (alpha <= 0 || !str) return; ctx.save(); ctx.globalAlpha *= alpha;
  let sz = size; if (maxW) { const w = measure(str, size, weight) + spacing * str.length; if (w > maxW) sz = size * maxW / w; }
  ctx.font = `${weight} ${sz}px ${SANS}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(str, x, y + opticalDy(ctx.font)); ctx.restore();
}
// 'middle' puts Hangul above the middle of its box (the glyphs sit high), so y is moved to where '가' is centred in its ink
const OPT = {};
function opticalDy(font) { if (!(font in OPT)) { const m = ctx.measureText('가'); OPT[font] = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2; } return OPT[font]; }
// a pill label; returns its width
function chip(str, x, y, { size = 26, fill = K.red, color = WHITE, a = 1, pad = 22, weight = 700, align = 'left' } = {}) {
  if (a <= 0) return 0; const w = measure(str, size, weight) + pad * 2, h = size * 1.9, x0 = align === 'center' ? x - w / 2 : x;
  rr(x0, y - h / 2, w, h, h / 2, fill, null, 0, a); text(str, x0 + pad, y + 1, { size, weight, color, alpha: a }); return w;
}
// entrance: fade + rise (or pop around ox, oy); moves only while entering
function enter(t, t0, fn, { d = .5, dy = 40, dx = 0, pop = false, ox = 960, oy = 540 } = {}) {
  const k = p(t, t0, d); if (k <= 0) return 0;
  ctx.save(); ctx.globalAlpha *= clamp(k * 2);
  if (pop) { const s = lerp(.4, 1, eBack(k)); ctx.translate(ox, oy); ctx.scale(s, s); ctx.translate(-ox, -oy); }
  else ctx.translate((1 - eOut(k)) * dx, (1 - eOut(k)) * dy);
  fn(k); ctx.restore(); return k;
}
// on screen until t1, then slides up and fades
function leave(t, t1, fn, up = 70) {
  const q = p(t, t1, .35); if (q >= 1) return;
  ctx.save(); ctx.globalAlpha *= 1 - q; ctx.translate(0, -up * eIO(q)); fn(); ctx.restore();
}
// scale the drawing around (cx, cy)
function zoomAt(cx, cy, s) { ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); }

// ---------- kinetic type ----------
// a line of words that pop up one by one at their spoken times. ws: [[word, time, { weight, color, hl, box, hlColor, size }]]
// hl: at that time a box (box colour) sweeps in behind the word and the word turns hlColor. Returns { x0, x1 }
function kin(t, ws, x, y, { size = 110, weight = 800, color = WHITE, align = 'center', d = .45, gap = .28, sp = -2 } = {}) {
  const it = ws.map(([s, t0, o = {}]) => { const sz = o.size || size, wt = o.weight || weight, w = measure(s, sz, wt) + sp * s.length; return { s, t0, o, sz, wt, w, lw: w + (o.hl !== undefined ? sz * .36 : 0) }; });   // lw: room for the box
  const tot = it.reduce((a, w) => a + w.lw, 0) + size * gap * (it.length - 1);
  let cx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x; const x0 = cx;
  for (const w of it) {
    const k = p(t, w.t0, d);
    if (k > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(k * 2.5); const e = lerp(.55, 1, eBack(k));
      ctx.translate(cx + w.lw / 2, y + (1 - eOut(k)) * w.sz * .5); ctx.scale(e, e);
      const draw1 = color1 => text(w.s, 0, 0, { size: w.sz, weight: w.wt, color: color1, align: 'center', spacing: sp });
      draw1(w.o.color || color);
      // the box sweeps in and the word changes colour only where the box already is (switching it all at once looked like a blink)
      if (w.o.hl !== undefined) { const hk = eOut(p(t, w.o.hl, .35)), pad = w.sz * .18, bx = -w.w / 2 - pad, by = -w.sz * .64, bw = (w.w + pad * 2) * hk, bh = w.sz * 1.28, r = w.sz * .18;
        if (hk > 0) { rr(bx, by, bw, bh, r, w.o.box || WHITE); ctx.save(); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, r); ctx.clip(); draw1(w.o.hlColor || K.red); ctx.restore(); } }
      ctx.restore();
    }
    cx += w.lw + size * gap;
  }
  return { x0, x1: cx - size * gap };
}
// a word rises out of a slot (masked)
function rise(t, t0, str, x, y, { size = 100, weight = 800, color = WHITE, align = 'left', d = .55, sp = -2 } = {}) {
  const k = p(t, t0, d); if (k <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * .78, W, size * 1.56); ctx.clip();
  text(str, x, y + (1 - eOut(k)) * size * 1.2, { size, weight, color, align, spacing: sp }); ctx.restore();
}
// a big question mark that tumbles in and then bobs
function qmark(t, t0, x, y, size, color = WHITE) {
  const k = p(t, t0, .55); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(k * 3); ctx.translate(x, y + Math.sin((t - t0) * 3.2) * 8 * k); ctx.rotate(lerp(-.9, 0, eBack(k)) + Math.sin((t - t0) * 2.4) * .06 * k);
  const s = lerp(.2, 1, eBack(k)); ctx.scale(s, s); text('?', 0, 0, { size, weight: 900, color, align: 'center' }); ctx.restore();
}
// the words of an on-screen string, each timed to where the narration line says it (edited text still works: missing cues fall back)
function words(str, line) { const ws = str.split(' '); return ws.map((w, i) => [w, Wc(line, w.replace(/[,.?!]/g, '').slice(0, 2), (i + .5) / ws.length)]); }

// ---------- backgrounds ----------
function blob(x, y, r, col) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, col.replace(/[\d.]+\)$/, '0)')); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function rings(t, col) { ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; [[1650, 180, 260, 1], [240, 900, 340, 2], [1500, 950, 120, 3]].forEach(([x, y, r, s]) => { ctx.beginPath(); ctx.arc(x + Math.sin(t * .3 + s) * 30, y + Math.cos(t * .25 + s) * 24, r, 0, 7); ctx.stroke(); }); ctx.restore(); }
const BG = {
  red: t => { const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, K.redHi); g.addColorStop(.55, K.red); g.addColorStop(1, K.crimson); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    blob(420 + Math.sin(t * .4) * 160, 260 + Math.cos(t * .3) * 80, 760, 'rgba(255,255,255,.17)'); blob(1600 + Math.cos(t * .35) * 120, 900, 700, 'rgba(120,0,20,.22)'); rings(t, 'rgba(255,255,255,.09)'); },
  white: t => { ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
    blob(1560 + Math.sin(t * .4) * 120, 160 + Math.cos(t * .3) * 60, 700, rgba(K.red, .08)); blob(300 + Math.cos(t * .3) * 100, 960, 640, rgba(K.blue, .05)); },
  navy: t => { const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, K.navy); g.addColorStop(1, K.navyDeep); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    blob(1500 + Math.sin(t * .4) * 140, 220, 760, rgba(K.blue, .22)); rings(t, 'rgba(255,255,255,.05)'); },
};
// a circle wipe to another background inside a scene (from ox, oy at t0); fn draws what is on it
function wipe(t, t0, ox, oy, bg, fn) {
  const k = eIO(p(t, t0, .6)); if (k <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.arc(ox, oy, k * Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy)) + 1, 0, 7); ctx.clip(); BG[bg](t); fn(); ctx.restore();
}

// ---------- icons (line icons) ----------
function ico(kind, x, y, s, c, a = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = Math.max(3, s * .16); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const B = () => ctx.beginPath(), Sk = () => ctx.stroke(), F = () => ctx.fill();
  if (kind === 'sparkle') { const st4 = (cx, cy, r) => { B(); for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4, r2 = i % 2 ? r * .28 : r; ctx.lineTo(cx + Math.sin(ang) * r2, cy - Math.cos(ang) * r2); } ctx.closePath(); F(); }; st4(x - s * .15, y + s * .1, s); st4(x + s * .75, y - s * .7, s * .42); }
  if (kind === 'send') { B(); ctx.moveTo(x, y + s); ctx.lineTo(x, y - s); Sk(); B(); ctx.moveTo(x - s * .75, y - s * .25); ctx.lineTo(x, y - s); ctx.lineTo(x + s * .75, y - s * .25); Sk(); }
  if (kind === 'person') { B(); ctx.arc(x, y - s * .45, s * .42, 0, 7); F(); B(); ctx.arc(x, y + s * 1.05, s * .9, Math.PI * 1.08, Math.PI * 1.92); ctx.closePath(); F(); }
  if (kind === 'download') { B(); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s * .35); Sk(); B(); ctx.moveTo(x - s * .55, y - s * .15); ctx.lineTo(x, y + s * .4); ctx.lineTo(x + s * .55, y - s * .15); Sk(); B(); ctx.moveTo(x - s, y + s * .4); ctx.lineTo(x - s, y + s); ctx.lineTo(x + s, y + s); ctx.lineTo(x + s, y + s * .4); Sk(); }
  if (kind === 'bell') { B(); ctx.moveTo(x - s * .8, y + s * .55); ctx.quadraticCurveTo(x - s * .7, y - s, x, y - s); ctx.quadraticCurveTo(x + s * .7, y - s, x + s * .8, y + s * .55); ctx.closePath(); Sk(); B(); ctx.moveTo(x - s, y + s * .55); ctx.lineTo(x + s, y + s * .55); Sk(); B(); ctx.arc(x, y + s * .85, s * .2, 0, Math.PI); Sk(); }
  if (kind === 'team') { [[-.55, .8], [.55, .8], [0, 1]].forEach(([dx, sc], i) => { B(); ctx.arc(x + dx * s, y - s * .35 * sc, s * .3 * sc, 0, 7); i < 2 ? Sk() : F(); }); B(); ctx.arc(x, y + s * .95, s * .7, Math.PI * 1.1, Math.PI * 1.9); Sk(); }
  if (kind === 'check') { B(); ctx.moveTo(x - s * .5, y); ctx.lineTo(x - s * .12, y + s * .38); ctx.lineTo(x + s * .55, y - s * .42); Sk(); }
  if (kind === 'q') text('?', x, y + s * .05, { size: s * 1.7, weight: 900, color: c, align: 'center' });
  ctx.restore();
}
// a mouse pointer
function pointer(x, y, s = 1, a = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 46); ctx.lineTo(12, 35); ctx.lineTo(21, 54); ctx.lineTo(29, 50); ctx.lineTo(20, 32); ctx.lineTo(36, 32); ctx.closePath();
  ctx.fillStyle = K.ink; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}
// an iOS-style switch, k = 0 off → 1 on
function toggle(x, y, k, a = 1) { rr(x, y - 32, 112, 64, 32, K.lineGrey, null, 0, a); rr(x, y - 32, 112, 64, 32, K.red, null, 0, a * k); circle(x + 32 + 48 * eIO(k), y, 26, WHITE, null, 0, a); }
// grey placeholder bar (text we do not show)
const skel = (x, y, w, h = 18, c = K.lightBox, a = 1) => rr(x, y - h / 2, w, h, h / 2, c, null, 0, a);

// ---------- console screenshot (assets/screens: 1440-px desktop captures at 2×, so 2880 px wide) ----------
// the report screens as captured (an internal video: no masking needed, the user said); every crop leaves out the sidebar
// (its foot shows a staff e-mail)
const IMG = {};
['01-sets', '02-report-summary', '03-report-metrics-questions', '06-set-settings'].forEach(n => { IMG[n] = new Image(); IMG[n].src = `assets/screens/${n}.png`; });
// the console in a browser window: a crop [sx, sy, sw, sh] of a capture, w wide at (x, y). Returns { X, Y, s, h } (PNG point → page)
function browser(name, [sx, sy, sw, sh], x, y, w) {
  const s = w / sw, bar = 48, h = sh * s + bar, m = { X: px => x + (px - sx) * s, Y: py => y + bar + (py - sy) * s, s, h };
  ctx.save(); card(x, y, w, h, { r: 18, shadow: .3 });
  [0, 1, 2].forEach(i => circle(x + 30 + i * 24, y + bar / 2, 7, ['#FF6159', '#FFBD2E', '#28C941'][i]));
  rr(x + w / 2 - 170, y + 12, 340, 26, 13, K.lightBox); text(C.title.url, x + w / 2, y + 25, { size: 16, weight: 600, color: K.muted, align: 'center' });
  ctx.beginPath(); ctx.roundRect(x, y + bar, w, h - bar, [0, 0, 18, 18]); ctx.clip(); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(IMG[name], sx, sy, sw, sh, x, y + bar, w, h - bar); ctx.restore(); return m;
}
// a magnifier over a screenshot: PNG point (px, py) shown mag× bigger in a circle at (cx, cy), with a connector from the point
function lens(t, t0, name, m, px, py, cx, cy, R, mag) {
  const k = p(t, t0, .5); if (k <= 0) return; const r = R * eBack(k), S2 = m.s * mag;
  ctx.save(); ctx.globalAlpha *= clamp(k * 2);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(m.X(px), m.Y(py)); ctx.lineTo(cx, cy); ctx.stroke(); circle(m.X(px), m.Y(py), 9, WHITE, K.red, 4);
  ctx.shadowColor = 'rgba(20,24,40,.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14; circle(cx, cy, r + 10, WHITE); ctx.shadowColor = 'transparent';
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip(); ctx.fillStyle = WHITE; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  ctx.drawImage(IMG[name], px - r / S2, py - r / S2, 2 * r / S2, 2 * r / S2, cx - r, cy - r, 2 * r, 2 * r); ctx.restore();
  circle(cx, cy, r + 4, null, K.red, 6); ctx.restore();
}
// dim everything but some rounded rects
function spot(rects, a, r = 14) {
  if (a <= 0) return; ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); rects.forEach(([x, y, w, h]) => ctx.roundRect(x, y, w, h, r));
  ctx.fillStyle = `rgba(14,20,36,${.55 * a})`; ctx.fill('evenodd'); rects.forEach(([x, y, w, h]) => rr(x, y, w, h, r, null, K.red, 5, a)); ctx.restore();
}
const AIS = () => [['ChatGPT', K.red], ['Gemini', K.blue], ['Claude', K.mintDark]];   // three AIs = 1st / 2nd / 3rd of a comparison
// "GEO 모니터링 콘솔" on one line, centred at (x, y); its width (for an underline as long as the words)
const lockupW = size => measure('GEO', size, 900) + size * .3 + measure('모니터링 콘솔', size * .82, 800) - 7;
function lockup(x, y, size, col = WHITE) {
  const w1 = measure('GEO', size, 900), gap = size * .3, x0 = x - lockupW(size) / 2;
  text('GEO', x0, y, { size, weight: 900, color: col }); text('모니터링 콘솔', x0 + w1 + gap, y + size * .04, { size: size * .82, weight: 800, color: col, spacing: -1 });
}

// ============================================================
// scenes (absolute time t), tools/script.py SCENES order. BGOF: the scene's background, ORIGIN: where its circle wipe starts
// ============================================================
const SC = {}, BGOF = {}, ORIGIN = {};
const H0 = id => S(id).start + .15;

// ---------- 1. the hook: a parent asks an AI — do we come up? ----------
BGOF.title = 'red';
SC.title = t => {
  const T = C.title, id = 'l1_1';
  const a = Wc(id, '학부모', .05), b = Wc(id, ['ai', '에이'], .2), send = Wc(id, '하면', .55), d = Wc(id, '재능', .7), f = Wc(id, '나올', .85);
  // the chat box: a dot that stretches into a bar, the question typed in, sent, then it moves up
  const up = eIO(p(t, send + .1, .55)), Y = lerp(520, 260, up), k0 = p(t, .2, .35), k1 = eOut(p(t, .45, .6));
  const pw = lerp(110, 1080, k1), ph = 112, x0 = 960 - pw / 2, typeEnd = send - .25;
  if (k0 > 0) {
    ctx.save(); ctx.globalAlpha *= clamp(k0 * 2); zoomAt(960, Y, lerp(.3, 1, eBack(k0)));
